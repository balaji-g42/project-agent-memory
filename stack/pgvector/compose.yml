name: memory-postgres

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      - POSTGRES_DB=memory
      - POSTGRES_USER=memory
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    cpus: "1.0"
    mem_limit: 1g
    mem_reservation: 512m
    pids_limit: 200

  prest:
    image: prest/prest:v2.4.2
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        export PREST_PG_PASS="$$(cat /run/secrets/postgres_password)";
        export PREST_JWT_KEY="$$(cat /run/secrets/prest_jwt_key)";
        exec /app/entrypoint.sh
    environment:
      - PREST_HTTP_PORT=3000
      - PREST_PG_HOST=postgres
      - PREST_PG_PORT=5432
      - PREST_PG_USER=memory
      - PREST_PG_DATABASE=memory
      - PREST_PG_SSL_MODE=disable
      - PREST_JWT_DEFAULT=true
      - PREST_JWT_ALGO=HS256
      - PREST_AUTH_ENABLED=true
      - PREST_QUERIES_STORAGE=database
      - PREST_QUERIES_REGISTER_ENABLED=true
      - PREST_QUERIES_REGISTER_ADMINS=admin
      - PREST_QUERIES_LOCATION=/app/queries
      - PREST_DEBUG=false
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./prest_queries:/app/queries
    secrets:
      - postgres_password
      - prest_jwt_key
    depends_on:
      postgres:
        condition: service_healthy
    cpus: "1.0"
    mem_limit: 512m
    mem_reservation: 256m
    pids_limit: 100

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  prest_jwt_key:
    file: ./secrets/prest_jwt_key.txt
